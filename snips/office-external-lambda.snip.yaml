name: Simple Cross App and Document
files:
    typescript:
        language: typescript
        content: |
            /*
            Allow Execution of a lambda in a different document context.

            Test Case
            - Create a table in Excel and then take an image and insert that image into Word and PowerPoint.

            */

            const targetExcel: ExternalLambdaTarget = {
                host: "Excel",
                documentName: "Demo - Cross App.xlsx",
            };

            const targetWord: ExternalLambdaTarget = {
                host: "Word",
                documentName: "Demo - Cross App.docx",
            };

            const targetPowerPoint: ExternalLambdaTarget = {
                host: "PowerPoint",
                documentName: "Demo - Cross App.pptx",
            };


            //
            // Lambdas
            //


            const lambdaExcelMakePrettyChartAndGetImage = async () => {

                function createTableSample(worksheet: Excel.Worksheet) {
                    // Split into [][] via regex matching multiple spaces or tabs
                    const data = `
            Fruit   Color   Quantity
            Orange  orange  5
            Apple   red     1
            Apple   green   2
            Apple   yellow  1
            Watermellon green 6
            Banana  yellow  6
                          `.trim().split("\n").map(line => line.trim().split(/\s+/));

                    const columnCount = data[0].length;
                    const rowCount = data.length;

                    // 1. Get the target range and assign values directly
                    const range = worksheet.getRangeByIndexes(0, 0, rowCount, columnCount);
                    range.values = data;

                    // 2. Create the table (true = has headers)
                    const table = worksheet.tables.add(range, true);

                    return table;
                }

                function createDoughnutChartFromTable(worksheet: Excel.Worksheet, table: Excel.Table) {
                    // Full table range to use for data
                    const range = table.getRange();

                    // Add a doughnut chart
                    const chart = worksheet.charts.add(
                        Excel.ChartType.doughnut,
                        range,
                        Excel.ChartSeriesBy.auto
                    );

                    // Format Chart
                    chart.title.text = "Fruit Quantities";
                    chart.legend.position = Excel.ChartLegendPosition.right;
                    chart.legend.visible = true;

                    return chart;
                }

                return await Excel.run({ delayForCellEdit: true }, async (context) => {

                    const sheetName = "Pretty Chart";

                    const workbook = context.workbook;

                    // Clear Sheet
                    let sheet = workbook.worksheets.getItemOrNullObject(sheetName);
                    sheet.delete();
                    sheet = workbook.worksheets.add(sheetName);

                    sheet.activate();

                    const table = createTableSample(sheet);

                    const chart = createDoughnutChartFromTable(sheet, table)

                    // Get Chart Image
                    const result = chart.getImage(500, 500)
                    await context.sync()
                    const imageBase64 = result.value
                    return imageBase64;

                });
            }

            const lambdaPowerPointAddBase64ImageToSlide = async (imageAsBase64: string) => {
                function addBase64Image(base64String: string, options?: {
                    imageLeft?: number;
                    imageTop?: number;
                    imageWidth?: number;
                    imageHeight?: number
                }): Promise<void> {
                    return new Promise((resolve, reject) => {
                        // Strip out the data URI prefix if present
                        const pureBase64 = base64String.replace(/^data:image\/[a-z]+;base64,/, "");

                        const { imageLeft, imageTop, imageWidth, imageHeight } = options || {};

                        const o: Office.SetSelectedDataOptions = {
                            coercionType: Office.CoercionType.Image,
                        };

                        if (imageLeft) {
                            o.imageLeft = imageLeft;
                        }
                        if (imageTop) {
                            o.imageTop = imageTop;
                        }
                        if (imageWidth) {
                            o.imageWidth = imageWidth;
                        }
                        if (imageHeight) {
                            o.imageHeight = imageHeight;
                        }

                        Office.context.document.setSelectedDataAsync(
                            pureBase64,
                            o,
                            function (asyncResult) {
                                if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                                    reject(new Error(asyncResult.error.message));
                                } else {
                                    resolve(asyncResult);
                                }
                            }
                        );
                    });
                }
                await PowerPoint.run(async (context) => {
                    const presentation = context.presentation;
                    const slide = presentation.slides.getItemAt(0);

                    // Clear slide
                    const shapes = slide.shapes;
                    shapes.load("items");
                    await context.sync();

                    for (let i = 0; i < shapes.items.length; i++) {
                        shapes.items[i].delete();
                    }
                    await context.sync()

                    await addBase64Image(imageAsBase64, {
                        imageLeft: 100,
                        imageTop: 100,
                        imageWidth: 600,
                        //imageHeight: 400,
                    })

                });
            }

            const lambdaWordAddBase64ImageToDocument = async (imageAsBase64: string) => {
                const pureBase64 = imageAsBase64.replace(/^data:image\/[a-z]+;base64,/, "");

                await Word.run(async (context) => {
                    const document = context.document;
                    const body = document.body;
                    body.clear();
                    body.insertInlinePictureFromBase64(pureBase64, Word.InsertLocation.start)
                });

            }


            async function runInsertTextInAll() {
                globalExternalLambda.clearQueue();

                console.log("run");

                const targetSelf: ExternalLambdaTarget = globalExternalLambda.ownTarget;
                //console.log("targetSelf", targetSelf);

                const lambdaExcel = async () => {
                    return await Excel.run({ delayForCellEdit: true }, async (context) => {
                        const color = Build.getRandomHtmlColorName();
                        console.log(`Lambda - Excel - Color: ${color}`);

                        // Clear
                        context.workbook.worksheets.getActiveWorksheet().getUsedRange().clear();

                        // Add
                        const range = context.workbook.getSelectedRange();

                        // add - text
                        range.values = [[color]];

                        // add - color
                        range.format.fill.color = color;

                        await context.sync();
                        return color;
                    });
                };

                const lambdaWord = async () => {
                    return await Word.run(async (context) => {
                        const color = Build.getRandomHtmlColorName();
                        console.log(`Lambda - Word - Color: ${color}`);

                        const body = context.document.body;

                        // Clear
                        body.clear();

                        // Add

                        // add - text
                        const paragraph = body.insertParagraph(`Hello From Excel! ${color}`, Word.InsertLocation.start);

                        // add - color
                        paragraph.font.color = color;

                        await context.sync();
                        return color;
                    });
                };

                const lambdaPowerPoint = async () => {
                    return PowerPoint.run(async (context) => {
                        const color = Build.getRandomHtmlColorName();
                        console.log(`Lambda - PowerPoint - Color: ${color}`);

                        const slide = context.presentation.slides.getItemAt(0);

                        // Clear
                        const shapes = slide.shapes;
                        shapes.load("items");
                        await context.sync();
                        shapes.items.forEach((shape: any) => shape.delete());

                        // Add

                        // add - text
                        const shape = slide.shapes.addTextBox(`Hello from Excel! ${color}`, {
                            left: 100,
                            top: 150,
                            width: 300,
                            height: 100,
                        });

                        // add - color
                        shape.textFrame.textRange.font.color = color;

                        await context.sync();
                        return color;
                    });
                };

                const runTargetLambdas: [string, ExternalLambdaTarget, () => unknown][] = [
                    ["self excel", targetSelf, lambdaExcel],
                    ["other excel", targetExcel, lambdaExcel],
                    ["other word", targetWord, lambdaWord],
                    ["other powerpoint", targetPowerPoint, lambdaPowerPoint],
                ];

                for (let i = 0; i < runTargetLambdas.length; i++) {
                    const [id, target, lambda] = runTargetLambdas[i];
                    console.log(`Execute External Lambda [${i}] ${id}`);

                    (async () => {
                        const result = await executeExternalLambda(target, lambda).catch((e) => {
                            console.error("Lambda Error", e);
                            return e;
                        });

                        console.log(`Execute External Lambda [${i}] ${id}`, "result:", result);
                    })();
                }
            }

            //
            //
            //

            let globalImageAsBase64 = "";

            async function runExcelCreateChart() {
                console.log(`Run - Excel - Create Chart`);

                const result = await executeExternalLambda(targetExcel, lambdaExcelMakePrettyChartAndGetImage).catch(e => {
                    console.error("Lambda Error", e);
                    return e;
                });
                console.log("Execute External Lambda - Excel", "result:", result);

                globalImageAsBase64 = result;
                Build.SimpleUi.img(id.img.chart).setSrcFromBase64(globalImageAsBase64);

            }

            async function runWordInsertChart() {
                console.log(`Run - Word - Insert Chart`);

                const result = await executeExternalLambda(targetExcel, lambdaWordAddBase64ImageToDocument, globalImageAsBase64).catch(e => {
                    console.error("Lambda Error", e);
                    return e;
                });

                console.log("Execute External Lambda - Word", "result:", result);
            }

            async function runPowerPointInsertChart() {
                console.log(`Run - PowerPoint - Insert Chart`);

                const result = await executeExternalLambda(targetExcel, lambdaPowerPointAddBase64ImageToSlide, globalImageAsBase64).catch(e => {
                    console.error("Lambda Error", e);
                    return e;
                });

                console.log("Execute External Lambda - PowerPoint", "result:", result);
            }


            //
            // Helpers
            //


            interface ExternalLambdaTarget {
                host: "Word" | "Excel" | "PowerPoint" | string;
                documentName: string;
            }

            let globalExternalLambda: Build.ExternalLambdaInstance<ExternalLambdaTarget>;

            async function initializeGlobalExternalLambda(host: ExternalLambdaTarget["host"]) {
                const documentName = Build.getOfficeDocumentName();

                const targetInfo: ExternalLambdaTarget = {
                    host,
                    documentName,
                };

                console.log(targetInfo);

                globalExternalLambda = Build.initializeExternalLambda(
                    "SimpleExternalLambda",
                    targetInfo,
                    (a, b) => a.host === b.host && a.documentName === b.documentName
                );

            }

            /**
             * Execute a lambda in the context of
             */
            async function executeExternalLambda<T, Args>(target: ExternalLambdaTarget, lambda: (...Args) => T, ...args: Args): Promise<T> {
                const promise = globalExternalLambda.executeLambda(target, lambda, arguments);
                return promise as Promise<T>;
            }

            //
            // UI
            //

            const id = Build.SimpleUi.createIds({
                div: ["ui"],
                img: ["chart"]
                textarea: ["storageCurrent", "storageWrite", "storageRead"]
            });


            async function setupUi() {
                Build.SimpleUi.create()
                    .h3({ text: "Cross App and Document " })
                    .p({ text: "Target" })
                    .p({ text: globalExternalLambda.ownTarget.host })
                    .p({ text: globalExternalLambda.ownTarget.documentName })
                    .p({ text: "Demo" })
                    .button({
                        text: "Run - Insert Text In All",
                        onclick: () => {
                            runInsertTextInAll();
                        },
                    })
                    .br()
                    .button({ text: "(1) Run - Excel - Create Chart", onclick: runExcelCreateChart })
                    .button({ text: "(2) Run - Word - Insert Chart", onclick: runWordInsertChart })
                    .button({ text: "(3) Run - PowerPoint - Insert Chart" onclick: runPowerPointInsertChart })
                    .img({ id: id.img.chart })
                    .br()
                    .p({ text: "Queue Debug" })
                    .button({
                        text: "Read Queue",
                        onclick: () => {
                            console.log(globalExternalLambda.currentQueue());
                        },
                    })
                    .button({
                        text: "Check Queue",
                        onclick: () => {
                            console.log(globalExternalLambda.checkQueue());
                        },
                    })
                    .button({
                        text: "Clear Queue",
                        onclick: () => {
                            globalExternalLambda.clearQueue();
                        },
                    })

                    .br()
                    .buildOnDiv(id.div.ui);

            }

            Office.onReady(async ({ host, platform }) => {
                console.log("READY");

                await initializeGlobalExternalLambda(host);

                setupUi();
            });
    html:
        language: html
        content: |-
            
            <div id = "div-ui"> </div>
    css:
        language: css
        content: |+
            
            body {
                background-color: white;
            }

            h1 { 
                color: black;
            }

            button {
                margin: 0;
                margin-left: 20px;
                margin-bottom: 5px;
                min-width: 80px;
                background-color: #f4f4f4;
                border: 1px solid #f4f4f4;
                padding: 4px 20px 6px;
            }

            button:hover {
                background-color: #eaeaea;
            }

            button:focus {
                background-color: #eaeaea;
                border-color: #0078d7;
            }

            button:active {
                background-color: #0078d7;
                border-color: #0078d7;
                color: #fff;
            }

    libraries:
        language: text
        content: |
            https://appsforoffice.microsoft.com/lib/1/hosted/office.js
            https://appsforoffice.microsoft.com/lib/1/hosted/office.d.ts

            https://wandyezj.github.io/build-add-in/library/build.js
